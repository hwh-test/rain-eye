# 이 파일을 같은 폴더에 config.properties 로 복사한 뒤 값을 채우세요.
# config.properties 는 .gitignore 에 들어 있어 Git에 올라가지 않습니다.

# --- MariaDB ---
db.url=jdbc:mariadb://localhost:3306/raineye
db.user=raineye
db.password=여기에_DB_비밀번호

# --- 기상청 단기예보 (공공데이터포털) ---
# 마이페이지의 "일반 인증키 (Decoding)" 값을 넣습니다. 서버가 URL 인코딩합니다.
kma.serviceKey=

# --- Google Maps JavaScript API ---
# 브라우저에 노출되는 키이므로 콘솔에서 반드시 HTTP 리퍼러 제한을 겁니다.
gmaps.apiKey=
# Advanced Marker에는 Map ID가 필요합니다. 처음엔 DEMO_MAP_ID로 시작하고, 콘솔에서 만든 ID로 바꿉니다.
gmaps.mapId=DEMO_MAP_ID
